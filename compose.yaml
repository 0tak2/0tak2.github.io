services:
  portfolio:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:2345:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./infra/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    restart: unless-stopped
